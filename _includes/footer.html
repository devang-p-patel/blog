<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <a class="footer-logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <p class="footer-tagline">{{ site.tagline }}</p>
    </div>
    <div class="footer-links">
      <a href="{{ '/' | relative_url }}">Writing</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      {% if site.twitter_username %}
        <a href="https://twitter.com/{{ site.twitter_username }}" rel="noopener" target="_blank">Twitter</a>
      {% endif %}
      {% if site.github_username %}
        <a href="https://github.com/{{ site.github_username }}" rel="noopener" target="_blank">GitHub</a>
      {% endif %}
    </div>
    <div class="footer-copy">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author | default: site.title }}. All rights reserved.</p>
    </div>
  </div>
</footer>
