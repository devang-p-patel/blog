title: DP's Journal
tagline: Thoughts on technology, design, and the human condition
email: dp@example.com
description: >-
  A personal blog exploring ideas at the intersection of technology,
  design, and modern life. Written by DP.
baseurl: ""
url: ""
author: DP
twitter_username: dp
github_username: devang-p-patel

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed

# Pagination
paginate: 6
paginate_path: "/page/:num/"

# Permalinks
permalink: /:year/:month/:day/:title/

# Sass
sass:
  style: compressed

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
